<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moments</title>
    <link rel="stylesheet" href="../../css/looks.css" />
    <link rel="stylesheet" href="../../css/moments.css" />
    <link rel="stylesheet" href="specimens.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 16px;
      }
      [hidden] {
        display: none !important;
      }
      /* A shorter toast keeps the test quick; it still has to last all of it. */
      [data-name='toast'] {
        --toast-time: 1.5s;
      }
    </style>
  </head>
  <body>
    <main></main>
    <script type="module">
      // The look and motion come from the query string (?look=folio&motion=reduce), so the same
      // page serves every run. Without motion= the system setting decides.
      import { specimens } from './specimens.js';

      const query = new URLSearchParams(location.search);
      const html = document.documentElement;
      if (query.get('look')) html.dataset.look = query.get('look');
      if (query.get('motion')) html.dataset.motion = query.get('motion');

      const main = document.querySelector('main');
      const plays = {};
      for (const spec of specimens) {
        const card = document.createElement('section');
        card.className = 'moment-specimen';
        card.dataset.name = spec.name;
        card.innerHTML = `<div class="card-head"><h3>${spec.name}</h3><span class="lives">${spec.lives}</span><button type="button" class="btn small play">Play</button></div><div class="stage"></div><p class="says">${spec.says}</p>`;
        main.append(card);
        const stage = card.querySelector('.stage');
        plays[spec.name] = spec.setup(stage);
        card.querySelector('.play').onclick = () => plays[spec.name]();
      }
      /** Plays one specimen, or all of them at once, and resolves when they're done. */
      window.playMoments = (names = Object.keys(plays)) =>
        Promise.all(names.map((name) => plays[name]()));
      window.momentNames = Object.keys(plays);
    </script>
  </body>
</html>
